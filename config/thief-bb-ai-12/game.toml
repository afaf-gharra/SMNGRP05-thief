# PRIVATE, LOCAL configuration for THIS peer only.
#
# Nothing the opponent must agree on lives here. Every shared term — board size,
# start cells, movement set, barrier quota, scoring, pheromone model, map area,
# hint length — lives ONLY in the signed `game.json` beside this file, which both
# peers hold byte-identically and verify by SHA-256 before the first move.
#
# Book: Appendix B (JSON = shared and signed; TOML = private and local).
version = "1.00"

[game]
group_id   = "SMNGRP05"
group_name = "SMNGRP05"
# Both derived natively from the terms and the two group codes, not pinned from
# anyone's message. bb-ai-12 have not published a uid of their own, so there is
# nothing to reconcile against; if theirs differs when it arrives, that is a
# signal to stop rather than something to paper over.
series_id  = "SMNGRP05-vs-bb-ai-12"
series_uid = "f3116b05-86b2-e873-0422-d6d6b84d3c19"  # re-derived after barriers_max returned to the legal 14.
members    = ["Afaf Gharra", "Reem Awawdy"]
counted_games_played = 6  # COUNTED: saedshki, uoh-ay26, vibecode, imreeyal, ali-ahm1,
# and yamanagh (the replay of 24/08). This bb-ai-12 series is a FRIENDLY and is
# deliberately NOT in the count -- see [league] for why it cannot be counted.
repos      = { cop = "https://github.com/afaf-gharra/SMNGRP05-police", thief = "https://github.com/afaf-gharra/SMNGRP05-thief" }
# Our live tunnel, announced to them in writing. Verified against the running
# ngrok agent rather than copied forward from a previous opponent's config --
# a stale URL here is how we once told a peer their tunnel was down when it was
# ours that had moved.
mcp_servers = { cop = "https://e6d6-147-236-163-154.ngrok-free.app/mcp", thief = "https://e6d6-147-236-163-154.ngrok-free.app/mcp" }
[network]
host                   = "0.0.0.0"                     # bind wide so a tunnel can reach us
my_port                = 8801                          # MY MCP server port
opponent_url           = "https://comic-leverage-paprika.ngrok-free.dev/mcp"  # single endpoint, both roles
# alternate every sub-game, so a single fixed URL would spend half the series
opponent_urls = { cop = "https://comic-leverage-paprika.ngrok-free.dev/mcp", thief = "https://comic-leverage-paprika.ngrok-free.dev/mcp" }
turn_timeout_seconds   = 180                           # DeadlineTracker: opponent silence budget
poll_interval_seconds  = 0.5
connect_timeout_seconds = 1800
call_timeout_seconds    = 10   # strictly under the signed response_timeout_sec of 30  # W010: their cop was still 502 well after kickoff,
# and both restarts of ours only reset a five-minute clock without changing that.
# Wait half an hour for the opponent to appear rather than scoring sub-game 1 a
# technical loss and forcing yet another coordinated restart. Private, local, not
# a signed term. The per-turn budget stays at 180s, so a peer that connects and
# then dies is still caught quickly -- this only buys patience before the series
# has begun, which is exactly where the waiting has actually been.
retry_interval_seconds = 1.0
audit_send_timeout_seconds = 10
watchdog_timeout_seconds = 2100   # must EXCEED connect_timeout_seconds: the handshake retry loop does not beat the heartbeat.

[belief]
smell_trust_weight = 4.0    # how sharply a scent reading concentrates the belief mass
hint_trust_initial = 0.5    # prior P(opponent's hint is truthful)
hint_trust_floor   = 0.05   # never fully trust or fully dismiss a talker
hint_trust_ceiling = 0.95

[strategy]
# The graded seam. Point either key at a BrainBase subclass "package.module:Class".
police_class = "p2p_chase.strategy.police_brain:ArchitectPolice"
thief_class  = "p2p_chase.strategy.safe_thief:SafeThief"

[strategy.police]
capture_confidence = 0.45   # belief mass on one adjacent cell before we claim a capture.
#                             Raised from 0.18 after a live loss: at that bar the officer
#                             claimed ten times in one sub-game, caught nothing, announced
#                             its own cell each time, and oscillated chasing the belief peak.
# ---------------------------------------------------------------- NO-WALL
# bb-ai-12 do not implement barrier_placed or barrier-based capture. That left
# no legal value for the SIGNED barriers_max:
#   14 -> legal, but our walls would be invisible to their thief, it would walk
#         through them, and from the first wall the two sides hold different
#         boards. Contradictory audits on an otherwise clean match.
#    0 -> no divergence, but Appendix F table 15 lists the barrier quota of 14
#         with status MINIMUM, and rule 12 permits raising a minimum by
#         agreement and NEVER lowering it, on pain of the score being voided.
#
# The way out is that barriers_max is a CEILING, not a floor -- the book defines
# it as "the maximum number of barriers the officer is PERMITTED to place". No
# rule requires placing any. So we sign the legal 14 and decline to build, which
# is a private strategy choice and not a term at all.
#
# Two knobs are needed, not one. wall_threshold gates the barrier planner, but
# _seal_shot is a SEPARATE path gated by seal_confidence -- sealing the cell the
# thief stands on is an outright capture under rules 46/47, so it bypasses the
# planner entirely. Measured: wall_threshold alone still placed 30 walls in 30
# games against a greedy thief. Both together give zero.
#
# Verified over 120 arena matches against three thief archetypes: ZERO walls
# placed, and captures completely unchanged (40/40 vs greedy, 0/40 vs safe and
# openspace -- identical to the default preset). The officer gives up nothing
# measurable, because our walls already convert nothing against a careful thief.
wall_threshold     = 1e9    # NO-WALL: gate the barrier planner shut.
seal_confidence    = 1.1    # NO-WALL: above 1.0, so the seal path can never fire.
barrier_reserve    = 3      # walls held back for the endgame squeeze
anchor_bonus       = 1.2    # per side already touching a wall or the board edge
cut_bonus          = 6.0    # sealing a cut vertex severs a corridor outright
occupancy_bonus    = 12.0   # sealing a cell the thief is standing on IS a capture
own_region_floor   = 0.25   # never wall ourselves into less than this share of the board
pressure_weight    = 1.0    # weight on expected walking distance to the thief
containment_weight = 0.5    # weight on shrinking the thief's reachable region
coverage_weight    = 1.2    # weight on belief mass within one step of us
centrality_weight  = 0.2    # mild pull toward the centre of mass on quiet turns

[strategy.thief]
region_weight    = 1.0      # weight on "how much room do I still have"
mobility_weight  = 3.0      # weight on "how many cells can I reach in three moves"
#                           A corner reports full region size and two exits, so
#                           without this term nothing sees the trap closing.
distance_weight  = 0.35     # weight on "how far from the believed officer".
#                           Lowered from 0.6: raw distance is what walks a thief
#                           into the far corner, which is exactly how uoh-ay26
#                           took all three of our thief sub-games at step 12.
novelty_weight   = 0.15     # mild preference for unvisited cells
deadend_penalty  = 0.8      # a cell with one exit is one barrier from losing
contact_penalty  = 1.5      # never volunteer to stand next to the officer
exposure_weight  = 0.4      # weight on belief mass within two steps

[trash_talk]
# HOW the natural-language hint is written. The MOVE is ALWAYS pure Python and is
# never delegated to a model (book ch.6, mandatory rule 25).
provider      = "template"   # template (0 tokens, default) | claude_api | ollama | claude_cli
model         = "claude-haiku-4-5-20251001"
every_n_steps = 1
lie_rate      = 0.45         # target fraction of hints that are deliberate misdirection

[llm]
model                  = "template-zero-token"
step_deadline_seconds  = 20   # hard cap on hint generation; miss => template fallback
timeout_seconds        = 60

[email]
enabled   = true
recipient = "afafgharra000@gmail.com"   # DISARMED: ourselves only.
# FRIENDLY. Nobody else on any recipient line -- not bb-ai-12, and above all not
# the league address. This series cannot be counted (see [league]), so there is
# no circumstance in which the lecturer's address belongs here. The line must
# never be flipped speculatively: a config carrying counted = true together with
# the league address, run by accident, files a series nobody authorised, which is
# a false declaration under rules 37-38.
sender    = "me"
[league]
# FRIENDLY, and it must stay one. bb-ai-12 disclosed two gaps in writing:
#   1. They do not implement barrier_placed or barrier-based capture.
#   2. Their negotiate LOGS a terms mismatch instead of aborting on it.
# Gap 1 alone would break the audit rather than merely risk it. Our officer
# really does spend walls -- 22 of them against our own thief over 40 arena
# matches, 78 against an open-space one -- and a peer that ignores
# barrier_placed walks its thief straight through them. From the first wall the
# two sides hold different boards, so our sealed history says "blocked" where
# theirs says "moved": contradictory records at the audit, on a match that
# otherwise ran perfectly. Rules 46/47 barrier-capture compounds it, since we
# would claim a capture they never register.
# Gap 2 is what turns that from a risk into a certainty: a barriers_max
# disagreement is precisely what the handshake exists to refuse.
# The fix is in the SIGNED terms, not here -- game.json sets max_barriers = 0,
# agreed with them in writing. Measured before proposing it: 240 arena matches
# at zero barriers, no exception raised, zero walls placed, the officer simply
# never reaches for one. Symmetric, so neither side is handicapped.
series_consensus = false   # bb-ai-12 do not implement it; never send an unknown
#                            key to a peer that may refuse unknown keys.
counted       = false   # DISARMED, and not merely pending. A counted series needs
#                         a handshake that REFUSES on mismatch, and theirs does
#                         not. Arming this would file a series whose physics the
#                         opponent never verified.
first_meeting = true    # first meeting with bb-ai-12. Irrelevant while counted is
#                         false -- diversity_reward applies to counted play only --
#                         but recorded truthfully rather than left wrong.
# Declared physics, sent to them in writing so a mismatch surfaces before move one
# rather than at the audit.
scent_model_sha256 = "81ebee59640e80eae8ca9ee5f86abd26e7edf5cdbb27d15925cb6ee45ca6ddf4"
info_mode_sha256   = "020947daeeb3f73494af9b04201326791742c7184085456e3517d21981ee1202"
