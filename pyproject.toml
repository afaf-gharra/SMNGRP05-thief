[project]
name = "p2p-chase"
version = "1.00"
description = "Distributed cops-and-robbers over a peer-to-peer network: two autonomous MCP agents, commit-reveal integrity, stigmergic scent trails and Bayesian belief."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Group SMNGRP05, University of Haifa, CS 2026" }]
keywords = ["multi-agent", "mcp", "dec-pomdp", "stigmergy", "commit-reveal"]
dependencies = [
    "fastmcp>=2.10",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
]
llm = [
    "anthropic>=0.40",
]

[project.scripts]
p2p-chase = "p2p_chase.cli:main"

[build-system]
requires = ["uv_build>=0.8.20,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "p2p_chase"
module-root = "src"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is enforced by the formatter, not by lint noise
]

[tool.ruff.lint.per-file-ignores]
# RateLimited and RestartSeries are control-flow signals rather than faults, and
# read correctly at the call site ("except RestartSeries"). The N818 "-Error"
# suffix convention would make both read worse for no safety gain.
"src/p2p_chase/exceptions.py" = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that start real MCP servers"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__main__.py",
    "*/gui/*",
    "*/infra/mcp_server.py",
    "*/infra/mcp_client.py",
    "*/infra/gmail_sender.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
